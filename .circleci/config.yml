version: 2.1

jobs:
  build-pack-publish:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0
    working_directory: ~/repo

    steps:
      - checkout

      # NuGet cache (no checksum)
      - restore_cache:
          keys:
            - nuget-v1-

      - run:
          name: Add GitHub Packages NuGet source
          command: |
            dotnet nuget add source \
              https://nuget.pkg.github.com/simondoescoding/index.json \
              --name github \
              --username simondoescoding \
              --password $NUGET_AUTH_TOKEN \
              --store-password-in-clear-text

      - run:
          name: Restore
          command: dotnet restore . --verbosity minimal

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: nuget-v1-

      - run:
          name: Build
          command: dotnet build . --configuration Release --no-restore

      # Create and push git tag (main only)
      - run:
          name: Create git tag
          command: |

            git fetch --tags

            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              NEXT_VERSION="v1.0.0"
            else
              VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              if [ "$CIRCLE_BRANCH" != "main" ]; then
                NEXT_VERSION="v$MAJOR.$MINOR.$PATCH"
              else
                echo "main branch: Incrementing version tag"
                PATCH=$((PATCH + 1))
                NEXT_VERSION="v$MAJOR.$MINOR.$PATCH"
                echo "Creating tag $NEXT_VERSION"
                git config user.email "ci@circleci.com"
                git config user.name "CircleCI"
                git tag "$NEXT_VERSION"
                git push --tag https://$GITHUB_TOKEN@github.com/SimonDoesCoding/$GITHUB_PROJECT.git
              fi
            fi
            IMAGE_VERSION=$(echo "$NEXT_VERSION" | sed 's/^v//')
            echo "export IMAGE_VERSION=$IMAGE_VERSION" >> $BASH_ENV

      - run:
          name: Set package version
          command: |
            BASE_VERSION=1.0.0

            if [ "$CIRCLE_BRANCH" = "main" ]; then
              PACKAGE_VERSION=$IMAGE_VERSION
            else
              PACKAGE_VERSION="$IMAGE_VERSION-dev.$CIRCLE_BUILD_NUM"
            fi

            echo "export PACKAGE_VERSION=$PACKAGE_VERSION" >> $BASH_ENV

      - run:
          name: Pack
          command: >
            dotnet pack .
            --configuration Release
            --no-build
            --output ./artifacts
            -p:PackageVersion=$PACKAGE_VERSION

      - run:
          name: Push NuGet package
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
              dotnet nuget push ./artifacts/*.nupkg \
                --source https://nuget.pkg.github.com/simondoescoding/index.json \
                --api-key $NUGET_AUTH_TOKEN \
                --skip-duplicate
            else
              echo "Skipping NuGet publish for pull request"
            fi

workflows:
  build-and-publish:
    jobs:
      - build-pack-publish:
          filters:
            branches:
              only:
                - main
                - development
